name: verify
on: [push, pull_request, workflow_dispatch]
jobs:
  offline:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_USER: offerpilot
          POSTGRES_PASSWORD: offerpilot
          POSTGRES_DB: offerpilot_test
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U offerpilot" --health-interval 3s --health-retries 30
    env:
      APP_MODE: test
      ENVIRONMENT: development
      TEST_DATABASE_URL: postgresql+psycopg://offerpilot:offerpilot@localhost:5432/offerpilot_test
      E2E_DATABASE_URL: postgresql+psycopg://offerpilot:offerpilot@localhost:5432/offerpilot_test_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.14'}
      - uses: actions/setup-node@v4
        with: {node-version: '24.19.0'}
      - run: python -m pip install uv==0.13.5
      - run: npm install -g pnpm@11.25.0
      - run: make bootstrap
      - run: pnpm exec playwright install --with-deps chromium
      - run: make verify
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            test-results
            playwright-report
  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
