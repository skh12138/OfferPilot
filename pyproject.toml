[project]
name = "offerpilot"
version = "0.1.0"
description = "私有求职工作台"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "sqlalchemy[asyncio]>=2.0.38,<2.1",
  "psycopg[binary,pool]>=3.2,<4", "alembic>=1.14,<2", "httpx>=0.28,<1",
  "argon2-cffi>=23.1,<26", "langgraph>=1.0,<2", "python-dateutil>=2.9,<3",
]
[dependency-groups]
dev = ["ruff>=0.9,<1", "mypy>=1.15,<2", "pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "types-python-dateutil>=2.9", "respx>=0.22,<1", "build>=1.2,<2"]
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["apps/server/src/offerpilot"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["apps/server/tests"]
markers = ["live: explicit paid network acceptance"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/server/src"]
[tool.uv]
package = true
